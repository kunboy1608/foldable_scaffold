name: foldable_router_example
description: "Example app for foldable_router: open vs push, parent chains, async guards, refresh and push results."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  foldable_router:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
