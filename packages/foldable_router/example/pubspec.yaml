name: foldable_router_example
resolution: workspace
description: "Example app for foldable_router: open vs push, parent chains, async guards, refresh and push results."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  foldable_router:
    path: ../
  # Prototype-only: this example app is allowed to depend on foldable_scaffold
  # to prove the router's pane frames can be hosted in a real FoldableScaffold.
  # The foldable_router *package* still does not depend on it.
  foldable_scaffold:
    path: ../../foldable_scaffold

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
