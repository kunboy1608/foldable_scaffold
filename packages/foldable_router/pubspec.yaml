name: foldable_router
resolution: workspace
description: >-
  Router for foldable apps: one page stack per branch (tab), Cupertino page
  slides, swipe back, deep links, redirects and guards. Works with
  foldable_scaffold without depending on it.
version: 0.1.0
repository: https://github.com/kunboy1608/foldable_scaffold/tree/main/packages/foldable_router

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  foldable_core: ^0.1.0
  material_ui: ^1.1.0

dev_dependencies:
  foldable_scaffold: ^0.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - foldable
  - router
  - navigation
