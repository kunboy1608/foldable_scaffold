name: foldable_router
resolution: workspace
description: >-
  Router for foldable apps: one page stack per branch (tab), Cupertino page
  slides, swipe back, deep links, redirects and guards, on top of
  foldable_scaffold.
version: 0.1.0
repository: https://github.com/kunboy1608/foldable_scaffold/tree/main/packages/foldable_router

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  foldable_scaffold: ^0.1.0
  material_ui: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - foldable
  - router
  - navigation
