name: foldable_scaffold
resolution: workspace
description: >-
  Experimental. Two-pane Scaffold for foldables, tablets and desktop: resizable divider,
  animated pane switching, and instant pane changes while pages slide.
version: 0.1.0-dev.1
repository: https://github.com/kunboy1608/foldable_scaffold/tree/main/packages/foldable_scaffold

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  foldable_core: ^0.1.0-dev.1
  material_ui: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - foldable
  - responsive
  - layout
